[project]
name = "voicebridge"
version = "0.1.0"
description = "Thin MCP bridge exposing VoiceStudio audiobook + translation over VoiceStudio HTTP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "httpx==0.28.1",
]

[project.scripts]
voicebridge = "voicebridge.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicebridge"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
