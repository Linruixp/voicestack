[project]
name = "speaker-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "huggingface-hub==2.0.0",
    "mcp==2.2.0",
    "mlx-whisper==0.4.3",
    "numpy==2.5.3",
    "pyannote-audio==4.0.7",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlite-vec==0.1.9",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
